# Every synthetic assumption lives here. Real inputs: M5 sales_train_evaluation,
# sell_prices, calendar. Everything below is invented and seeded, and is labeled
# synthetic in the README.
seed: 42

window:
  history_start_d: 1500        # first day loaded into DuckDB (2015-03-08)
  plan_start_d: 1914           # first planned day (2016-04-25), the M5 evaluation window
  plan_days: 28                # through d_1941 (2016-05-22)
  forecast_lookback_days: 28   # moving average window, strictly before the planned day

layout:
  items_per_bay: 24            # items placed in item_id order inside a department
  bays_per_aisle: 8            # one side of an aisle, 96 ft long
  bay_width_ft: 12
  aisle_spacing_ft: 24
  front_aisle_ft: 30           # distance from the back room door to the first aisle
  walk_ft_per_min: 150         # walking with a loaded cart

shelf:
  days_of_cover: 4             # capacity = ceil(days_of_cover * mean daily demand before plan start)
  min_capacity: 4
  reorder_fraction: 0.35       # restock when projected end-of-day level < this share of capacity
  start_fraction: 0.8          # shelf level on the first planned morning

durations:                     # minutes
  restock_setup: 6             # pull cart from back room, open bay
  restock_per_unit: 0.12
  restock_per_item: 0.4
  price_setup: 3
  price_per_label: 1.5
  reset_per_bay: 45            # planogram reset of one bay

resets:
  bays_per_day: 2              # reset program: each store resets this many bays per day, in a
                               # seeded random order, due on the listed day

priority:
  # high must dominate: one high task outweighs a shift's worth of lower ones (near-lexicographic)
  weights: {high: 1000, medium: 30, low: 10}
  price_deadline_min: 720      # new price labels must be up by 12:00 on the effective day

staff:
  # shift start and end in minutes after midnight; skills: R restock, P pricing, S reset
  shifts:
    - {id: A1, start: 360, end: 870, skills: [R, P]}       # 06:00-14:30
    - {id: A2, start: 360, end: 870, skills: [R, S]}       # 06:00-14:30
    - {id: A3, start: 600, end: 1110, skills: [R, P, S]}   # 10:00-18:30
    - {id: A4, start: 840, end: 1350, skills: [R]}         # 14:00-22:30

solver:
  slot_min: 15                 # start times on a 15 minute grid
  time_limit_s: 3              # quality flat after ~1 s on an overloaded day (CA_3 d1919: 1s 62, 3s 62, 30s 61 high tasks)
  workers: 4
  travel_weight: 1             # objective: sum(weight * done) * scale - travel minutes
  priority_scale: 10
